<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<meta name="referrer" content="no-referrer">
<title>安装 po0 防火墙加白 Surge 模块</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --bg: #fff; --code: #f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f0f6fc; --muted: #9198a1; --line: #3d444d; --bg: #0d1117; --code: #151b23; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p, li { color: var(--muted); }
  .install { display: block; margin: 24px 0; padding: 14px; border-radius: 10px; background: #0a84ff; color: #fff; font-weight: 600; text-align: center; text-decoration: none; }
  .url { display: flex; gap: 8px; }
  code { flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--code); font-size: 13px; color: var(--fg); }
  button { padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
  a { color: #0a84ff; }
</style>
</head>
<body>
<main>
  <h1>安装 po0 防火墙加白 Surge 模块</h1>
  <p>页面会尝试打开 Surge 并安装模块。没有反应时，点下面的按钮，或复制模块链接，在 Surge 中从 URL 安装模块。</p>
  <a class="install" id="install" href="surge:///install-module?url=https%3A%2F%2Fraw.githubusercontent.com%2Fzhdsmy%2Fpo0fw%2Fmain%2Fsurge%2Fpo0fw.sgmodule">在 Surge 中安装模块</a>
  <div class="url">
    <code id="url">https://raw.githubusercontent.com/zhdsmy/po0fw/main/surge/po0fw.sgmodule</code>
    <button type="button" id="copy">复制</button>
  </div>
  <ul>
    <li>需要在装有 Surge 的 iPhone、iPad 或 Mac 上打开。Mac 需要 Surge 6.7.0 及以上。</li>
    <li>安装后启用模块，填写 <code>tokens</code> 等参数。参数说明见 <a href="https://github.com/zhdsmy/po0fw/tree/main/surge#参数">README</a>。</li>
  </ul>
</main>
<script>
  location.href = document.getElementById("install").href;
  document.getElementById("copy").addEventListener("click", function () {
    var button = this;
    navigator.clipboard.writeText(document.getElementById("url").textContent).then(function () {
      button.textContent = "已复制";
    });
  });
</script>
</body>
</html>
